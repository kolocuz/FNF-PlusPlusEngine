name: Build

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows x64'
        type: boolean
        default: true
      release_mode:
        description: 'Create GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (if release_mode is true)'
        type: string
        default: 'v1.0.0'
      release_name:
        description: 'Release name (if release_mode is true)'
        type: string
        default: 'Release v1.0.0'

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.7

jobs:
  check_platforms:
    name: Check Platforms
    runs-on: ubuntu-24.04
    outputs:
      build_linux: ${{ steps.set_outputs.outputs.build_linux }}
      build_android: ${{ steps.set_outputs.outputs.build_android }}
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      release_mode: ${{ steps.set_outputs.outputs.release_mode }}
      release_tag: ${{ steps.set_outputs.outputs.release_tag }}
      release_name: ${{ steps.set_outputs.outputs.release_name }}
    steps:
      - id: set_outputs
        run: |
          echo "build_linux=${{ github.event.inputs.build_linux }}" >> $GITHUB_OUTPUT
          echo "build_android=${{ github.event.inputs.build_android }}" >> $GITHUB_OUTPUT
          echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
          echo "release_mode=${{ github.event.inputs.release_mode }}" >> $GITHUB_OUTPUT
          echo "release_tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT

  build_linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_linux == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ~/.haxelib
            ~/.cache/lime
          key: linux-haxe-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v1
          restore-keys: |
            linux-haxe-

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe libvlc-dev libvlccore-dev
          haxe --version

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Build
        run: haxelib run lime build Project.xml linux -DofficialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C export/release/linux/bin -czf dist/FNF-PlusEngine-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error

  build_android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_android == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ~/.haxelib
            ~/.cache/lime
          key: android-haxe-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v1
          restore-keys: |
            android-haxe-

      - name: Cache Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/Android
            ~/.android
          key: android-sdk-${{ hashFiles('**/Project.xml') }}-v1
          restore-keys: |
            android-sdk-

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe
          haxe --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Build
        run: haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error

  build_windows:
    name: Build Windows x64
    runs-on: windows-2025
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            C:\haxelib
            %USERPROFILE%\.haxelib
            %USERPROFILE%\.cache\lime
          key: windows-haxe-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v1
          restore-keys: |
            windows-haxe-

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          cmd /c setup\windows-lib.bat

      - name: Build
        run: haxelib run lime build Project.xml windows -DofficialBuild

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path export/release/windows/bin/* -DestinationPath dist/FNF-PlusEngine-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error

  publish_release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: 
      - check_platforms
      - build_linux
      - build_android
      - build_windows
    if: needs.check_platforms.outputs.release_mode == 'true'

    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-x64
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_platforms.outputs.release_tag }}
          name: ${{ needs.check_platforms.outputs.release_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.apk
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - build_linux
      - build_android
      - build_windows
      - publish_release
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.check_platforms.outputs.build_linux }}" == "true" ]]; then
            echo "| Linux | ${{ needs.build_linux.result }} | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/linux-x64) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.build_android }}" == "true" ]]; then
            echo "| Android | ${{ needs.build_android.result }} | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/android) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.build_windows }}" == "true" ]]; then
            echo "| Windows | ${{ needs.build_windows.result }} | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/windows-x64) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.release_mode }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Release created: [${{ needs.check_platforms.outputs.release_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.check_platforms.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          fi
