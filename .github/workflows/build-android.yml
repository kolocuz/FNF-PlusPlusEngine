on:
  workflow_call:
    inputs:
      build_mode:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.7
  LIME_VERSION: 8.2.1

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v2
          enableCrossOsArchive: true
          path: |
            ~/.haxelib/
            ~/.cache/lime
          restore-keys: |
            haxe-libs-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v1
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          restore-keys: |
            gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          path: ${{ env.ANDROID_SDK_ROOT }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Cache Haxe build
        id: cache-build
        uses: actions/cache@v4
        with:
          key: haxe-build-android-${{ github.sha }}
          restore-keys: |
            haxe-build-android-${{ github.ref }}
            haxe-build-android-
          path: |
            .haxe/
            build/
            export/release/android/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: Install Libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Build (fast mode)
        if: inputs.build_mode == 'fast'
        run: haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Build (full mode)
        if: inputs.build_mode == 'full'
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error
