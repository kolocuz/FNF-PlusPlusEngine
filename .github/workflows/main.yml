name: Build

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows x64'
        type: boolean
        default: true
      dev_build:
        description: 'Show GitHub commit build info in-game'
        type: boolean
        default: true

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0-${{ github.run_id }}
  HAXE_VERSION: 4.3.7
  DEV_BUILD_TAG: dev-build

jobs:
  check_platforms:
    name: Check Platforms
    runs-on: ubuntu-24.04
    outputs:
      build_linux: ${{ steps.set_outputs.outputs.build_linux }}
      build_android: ${{ steps.set_outputs.outputs.build_android }}
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      dev_build: ${{ steps.set_outputs.outputs.dev_build }}
    steps:
      - id: set_outputs
        run: |
          echo "build_linux=${{ github.event.inputs.build_linux }}" >> $GITHUB_OUTPUT
          echo "build_android=${{ github.event.inputs.build_android }}" >> $GITHUB_OUTPUT
          echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
          echo "dev_build=${{ github.event.inputs.dev_build }}" >> $GITHUB_OUTPUT

  build_linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_linux == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe libvlc-dev libvlccore-dev
          haxe --version

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
            public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
            public static inline final commit:String = "${{ github.sha }}";
            public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF

      - name: Build
        run: haxelib run lime build Project.xml linux --app-version="${APP_VERSION}" -DofficialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C export/release/linux/bin -czf dist/FNF-PlusEngine-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-artifact
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error

  build_android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_android == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe
          haxe --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
            public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
            public static inline final commit:String = "${{ github.sha }}";
            public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF
          rm -rf export build ~/.gradle

      - name: Build
        run: haxelib run lime build Project.xml android --app-version="${APP_VERSION}" -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-artifact
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error

  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-2025
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          cmd /c setup\windows-lib.bat

      - name: Prepare build
        run: |
          Set-Content -Path VERSION -Value "${{ github.run_id }}"
          @'
          package backend;

          class BuildInfoGenerated
          {
            public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
            public static inline final commit:String = "${{ github.sha }}";
            public static inline final runId:String = "${{ github.run_id }}";
          }
          '@ | Set-Content -Path source/backend/BuildInfoGenerated.hx

      - name: Build
        run: haxelib run lime build Project.xml windows --app-version="${env:APP_VERSION}" -DofficialBuild

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path export/release/windows/bin/* -DestinationPath dist/FNF-PlusEngine-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-artifact
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error

  summary:
    name: Workflow Summary
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - build_linux_x64
      - build_android
      - build_windows_x64
    if: always()

    steps:
      - name: Build tree summary
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(r'''${{ toJson(needs) }}''')
          order = [
              ("build_linux_x64", "Linux x64"),
              ("build_android", "Android"),
              ("build_windows_x64", "Windows x64"),
          ]
          icons = {
              "success": "[ok]",
              "failure": "[fail]",
              "cancelled": "[stop]",
              "skipped": "[skip]",
          }

          lines = ["## Resumen", "", "```text", "workflow"]
          failed = []

          for index, (job_id, label) in enumerate(order):
              result = needs[job_id]["result"]
              icon = icons.get(result, "[?]")
              branch = "`--" if index == len(order) - 1 else "|--"
              lines.append(f"{branch} {label}: {icon} {result}")
              if result not in ("success", "skipped"):
                  failed.append(label)

          lines.append("```")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if failed:
              sys.exit(1)
          PY
