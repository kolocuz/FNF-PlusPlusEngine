name: Build

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows x64'
        type: boolean
        default: true
      build_mode:
        description: 'Build mode'
        type: choice
        options:
          - fast
          - full
        default: fast
      release_mode:
        description: 'Create GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (if release_mode is true)'
        type: string
        default: 'v1.0.0'
      release_name:
        description: 'Release name (if release_mode is true)'
        type: string
        default: 'Release v1.0.0'

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.7
  LIME_VERSION: 8.2.1

jobs:
  check_platforms:
    name: Check Platforms
    runs-on: ubuntu-24.04
    outputs:
      build_linux: ${{ steps.set_outputs.outputs.build_linux }}
      build_android: ${{ steps.set_outputs.outputs.build_android }}
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      build_mode: ${{ steps.set_outputs.outputs.build_mode }}
      release_mode: ${{ steps.set_outputs.outputs.release_mode }}
      release_tag: ${{ steps.set_outputs.outputs.release_tag }}
      release_name: ${{ steps.set_outputs.outputs.release_name }}
    steps:
      - id: set_outputs
        run: |
          echo "build_linux=${{ github.event.inputs.build_linux }}" >> $GITHUB_OUTPUT
          echo "build_android=${{ github.event.inputs.build_android }}" >> $GITHUB_OUTPUT
          echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
          echo "build_mode=${{ github.event.inputs.build_mode }}" >> $GITHUB_OUTPUT
          echo "release_mode=${{ github.event.inputs.release_mode }}" >> $GITHUB_OUTPUT
          echo "release_tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT

  # ==================== LINUX ====================
  build_linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_linux == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Кеш 1: Haxe-зависимости
      - name: Cache Haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v2
          enableCrossOsArchive: true
          path: |
            ~/.haxelib/
            ~/.cache/lime
          restore-keys: |
            haxe-libs-

      # Кеш 2: Промежуточные файлы компиляции (для fast mode)
      - name: Cache Haxe build
        id: cache-build
        uses: actions/cache@v4
        with:
          key: haxe-build-linux-${{ github.sha }}
          restore-keys: |
            haxe-build-linux-${{ github.ref }}
            haxe-build-linux-
          path: |
            .haxe/
            build/
            export/release/linux/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install Libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      # Fast mode: используем Haxe-сервер
      - name: Start Haxe server (fast mode)
        if: needs.check_platforms.outputs.build_mode == 'fast'
        run: |
          haxe build.hxml --wait &
          sleep 3

      - name: Build (fast mode)
        if: needs.check_platforms.outputs.build_mode == 'fast'
        run: haxe build.hxml -DofficialBuild

      - name: Build (full mode)
        if: needs.check_platforms.outputs.build_mode == 'full'
        run: |
          haxelib run lime rebuild -clean
          haxe build.hxml -DofficialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C export/release/linux/bin -czf dist/FNF-PlusEngine-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error

  # ==================== ANDROID ====================
  build_android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_android == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Кеш 1: Haxe-зависимости
      - name: Cache Haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v2
          enableCrossOsArchive: true
          path: |
            ~/.haxelib/
            ~/.cache/lime
          restore-keys: |
            haxe-libs-

      # Кеш 2: Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v1
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          restore-keys: |
            gradle-

      # Кеш 3: Android SDK (ускоряет установку)
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # Кеш 4: Промежуточные файлы компиляции
      - name: Cache Haxe build
        id: cache-build
        uses: actions/cache@v4
        with:
          key: haxe-build-android-${{ github.sha }}
          restore-keys: |
            haxe-build-android-${{ github.ref }}
            haxe-build-android-
          path: |
            .haxe/
            build/
            export/release/android/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: Install Libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Build (fast mode)
        if: needs.check_platforms.outputs.build_mode == 'fast'
        run: haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Build (full mode)
        if: needs.check_platforms.outputs.build_mode == 'full'
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error

  # ==================== WINDOWS ====================
  build_windows:
    name: Build Windows x64
    runs-on: windows-2025
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Кеш 1: Haxe-зависимости
      - name: Cache Haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v2
          enableCrossOsArchive: true
          path: |
            ~\.haxelib\
            ~\AppData\Local\lime\
          restore-keys: |
            haxe-libs-

      # Кеш 2: Промежуточные файлы компиляции
      - name: Cache Haxe build
        id: cache-build
        uses: actions/cache@v4
        with:
          key: haxe-build-windows-${{ github.sha }}
          restore-keys: |
            haxe-build-windows-${{ github.ref }}
            haxe-build-windows-
          path: |
            .haxe\
            build\
            export\release\windows\obj\

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Install Libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          cmd /c setup\windows-lib.bat

      - name: Build
        if: needs.check_platforms.outputs.build_mode == 'fast'
        run: haxelib run lime build Project.xml windows -DofficialBuild

      - name: Build (full mode)
        if: needs.check_platforms.outputs.build_mode == 'full'
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml windows -DofficialBuild

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path export/release/windows/bin/* -DestinationPath dist/FNF-PlusEngine-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error

  # ==================== RELEASE ====================
  publish_release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: 
      - check_platforms
      - build_linux
      - build_android
      - build_windows
    if: needs.check_platforms.outputs.release_mode == 'true'

    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-x64
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: release-assets

      - name: List release assets
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_platforms.outputs.release_tag }}
          name: ${{ needs.check_platforms.outputs.release_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.apk
            release-assets/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== SUMMARY ====================
  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - build_linux
      - build_android
      - build_windows
      - publish_release
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Build Mode | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------------|----------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.check_platforms.outputs.build_linux }}" == "true" ]]; then
            echo "| Linux | ${{ needs.build_linux.result }} | ${{ needs.check_platforms.outputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/linux-x64) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Linux | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.build_android }}" == "true" ]]; then
            echo "| Android | ${{ needs.build_android.result }} | ${{ needs.check_platforms.outputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/android) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.build_windows }}" == "true" ]]; then
            echo "| Windows | ${{ needs.build_windows.result }} | ${{ needs.check_platforms.outputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/windows-x64) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Windows | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.check_platforms.outputs.release_mode }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Release created!" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** [${{ needs.check_platforms.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.check_platforms.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
            echo "- **Name:** ${{ needs.check_platforms.outputs.release_name }}" >> $GITHUB_STEP_SUMMARY
          fi
