name: Build and Release (Haxe/Lime)

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows x64'
        type: boolean
        default: true
      build_mode:
        description: 'Build mode'
        type: choice
        options:
          - fast
          - full
        default: fast
      release_mode:
        description: 'Create GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (if release_mode is true)'
        type: string
        default: 'v1.0.0'
      release_name:
        description: 'Release name (if release_mode is true)'
        type: string
        default: 'Release v1.0.0'

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.7
  ANDROID_SDK_VERSION: "36"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  # ==================== LINUX ====================
  build_linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.build_linux == 'true' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ runner.os }}-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v5
          path: |
            ~/.haxelib/
            ~/.cache/lime
          restore-keys: |
            haxe-libs-${{ runner.os }}-

      - name: Cache Haxe build (fast only)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        uses: actions/cache@v4
        with:
          key: haxe-build-linux-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            haxe-build-linux-${{ runner.os }}-${{ github.ref }}-
            haxe-build-linux-${{ runner.os }}-
          path: |
            .haxe/
            build/
            export/release/linux/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: |
          if [ -f "./setup/unish-lib.sh" ]; then
            chmod +x ./setup/unish-lib.sh
            ./setup/unish-lib.sh
          else
            echo "Setup script not found, installing via haxelib"
            haxelib install all
          fi

      - name: Build (fast)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        run: haxelib run lime build Project.xml linux -DofficialBuild

      - name: Build (full)
        if: ${{ github.event.inputs.build_mode == 'full' }}
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml linux -DofficialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C export/release/linux/bin -czf dist/FNF-PlusEngine-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error

  # ==================== ANDROID ====================
  build_android:
    name: Build Android
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.build_android == 'true' }}
    timeout-minutes: 45

    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ runner.os }}-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v5
          path: |
            ~/.haxelib/
            ~/.cache/lime
          restore-keys: |
            haxe-libs-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_VERSION }}-${{ hashFiles('**/build.gradle') }}
          path: ${{ env.ANDROID_SDK_ROOT }}
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_VERSION }}-

      - name: Cache Haxe build (fast only)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        uses: actions/cache@v4
        with:
          key: haxe-build-android-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            haxe-build-android-${{ runner.os }}-${{ github.ref }}-
            haxe-build-android-${{ runner.os }}-
          path: |
            .haxe/
            build/
            export/release/android/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          sdk-path: ${{ env.ANDROID_SDK_ROOT }}

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-$ANDROID_SDK_VERSION" \
            "build-tools;$ANDROID_SDK_VERSION.0.0" \
            "cmdline-tools;latest" \
            "ndk;$ANDROID_NDK_VERSION"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install Libraries
        run: |
          if [ -f "./setup/unish-lib.sh" ]; then
            chmod +x ./setup/unish-lib.sh
            ./setup/unish-lib.sh
          else
            echo "Setup script not found, installing via haxelib"
            haxelib install all
          fi

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Build (fast)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        run: haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Build (full)
        if: ${{ github.event.inputs.build_mode == 'full' }}
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml android -DofficialBuild -DHXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error

  # ==================== WINDOWS ====================
  build_windows:
    name: Build Windows x64
    runs-on: windows-latest
    if: ${{ github.event.inputs.build_windows == 'true' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          key: haxe-libs-${{ runner.os }}-${{ hashFiles('**/haxelib.json', '**/Project.xml') }}-v5
          path: |
            ~\.haxelib\
            ~\AppData\Local\lime\
          restore-keys: |
            haxe-libs-${{ runner.os }}-

      - name: Cache Haxe build (fast only)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        uses: actions/cache@v4
        with:
          key: haxe-build-windows-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            haxe-build-windows-${{ runner.os }}-${{ github.ref }}-
            haxe-build-windows-${{ runner.os }}-
          path: |
            .haxe/
            build/
            export/release/windows/obj/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib local
        run: haxelib newrepo

      - name: Install Libraries
        run: |
          if (Test-Path "./setup/windows-lib.bat") {
            & ./setup/windows-lib.bat
          } else {
            Write-Host "Setup script not found, installing via haxelib"
            haxelib install all
          }
        shell: pwsh

      - name: Build (fast)
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        run: haxelib run lime build Project.xml windows -DofficialBuild

      - name: Build (full)
        if: ${{ github.event.inputs.build_mode == 'full' }}
        run: |
          haxelib run lime rebuild -clean
          haxelib run lime build Project.xml windows -DofficialBuild

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path export/release/windows/bin/* -DestinationPath dist/FNF-PlusEngine-windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error

  # ==================== RELEASE ====================
  publish_release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build_linux
      - build_android
      - build_windows
    if: ${{ github.event.inputs.release_mode == 'true' && !cancelled() && !failure() }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-x64
          path: release-assets
        continue-on-error: true

      - uses: actions/download-artifact@v7
        with:
          name: android
          path: release-assets
        continue-on-error: true

      - uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: release-assets
        continue-on-error: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.apk
            release-assets/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== SUMMARY ====================
  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs:
      - build_linux
      - build_android
      - build_windows
      - publish_release
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Build Mode | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------------|----------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.build_linux }}" == "true" ]]; then
            echo "| Linux | ${{ needs.build_linux.result }} | ${{ github.event.inputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/linux-x64) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Linux | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.build_android }}" == "true" ]]; then
            echo "| Android | ${{ needs.build_android.result }} | ${{ github.event.inputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/android) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.build_windows }}" == "true" ]]; then
            echo "| Windows | ${{ needs.build_windows.result }} | ${{ github.event.inputs.build_mode }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/windows-x64) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Windows | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.release_mode }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Release created!" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** [${{ github.event.inputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
            echo "- **Name:** ${{ github.event.inputs.release_name }}" >> $GITHUB_STEP_SUMMARY
          fi
